name: Windows x86-64

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # MSYS2 UCRT64 (MinGW-w64 GCC), not MSVC: the DSP code uses GCC vector
  # extensions and the whole warning set in CMakeLists.txt is GCC syntax. The full `synth` is built here without the
  # terminal UI (SYNTH_BUILD_TERMINAL_UI is OFF on Windows); --headless is the
  # way to run it. x86-64-v2 and a pinned image for the same reason as the Linux
  # x86-64 job: every run must compile to the same instructions for the
  # golden-render hash to be meaningful.
  build-and-test:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-soundtouch
            mingw-w64-ucrt-x86_64-libunistring
            mingw-w64-ucrt-x86_64-python
            git

      - name: Configure
        run: cmake -G Ninja -B build -DSYNTH_MARCH=x86-64-v2

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke test
        run: python tools/smoke_headless.py ./build/synth.exe songs/demo3.xml 8

      - name: Render songs
        run: |
          mkdir -p rendered
          for song in demo3 welcome; do
            ./build/synth --render "rendered/$song.wav" "songs/$song.xml"
            # A WAV header alone is 44+ bytes; a real render is far larger.
            size=$(stat -c %s "rendered/$song.wav")
            echo "$song.wav: $size bytes"
            test "$size" -gt 100000
          done

      - name: Collect binary and DLLs
        run: |
          mkdir -p dist
          cp build/synth.exe dist/
          ldd build/synth.exe | awk '/\/ucrt64\// { print $3 }' | xargs -I{} cp {} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-wavs
          path: rendered/*.wav

      - uses: actions/upload-artifact@v4
        with:
          name: synth-windows-x86_64
          path: dist/
