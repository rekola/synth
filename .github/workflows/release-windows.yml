name: Windows installer

# Builds the installer on a version tag (and attaches it to the release),
# on demand, and on pull requests that touch how it is made.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    paths:
      - tools/windows/**
      - tools/smoke_headless.py
      - .github/workflows/release-windows.yml

permissions:
  contents: write

jobs:
  installer:
    # Pinned, with x86-64-v2, like the Windows CI job: the installer must run
    # on any 64-bit PC, not only on the machine that built it.
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-soundtouch
            mingw-w64-ucrt-x86_64-libunistring
            git

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSYNTH_MARCH=x86-64-v2

      - name: Build
        run: cmake --build build --target synth

      # A General MIDI SoundFont makes the instrument tracks sound as they do
      # on Linux. Without one the installer still works, with the built-in
      # fallback instrument. Set the repository variables SYNTH_SOUNDFONT_URL
      # (a direct link to the .sf2) and SYNTH_SOUNDFONT_SHA256 to include one;
      # its licence text goes in SYNTH_SOUNDFONT_LICENSE_URL.
      - name: SoundFont
        env:
          URL: ${{ vars.SYNTH_SOUNDFONT_URL }}
          SHA256: ${{ vars.SYNTH_SOUNDFONT_SHA256 }}
          LICENSE_URL: ${{ vars.SYNTH_SOUNDFONT_LICENSE_URL }}
        run: |
          mkdir -p soundfonts
          if [ -z "$URL" ] || [ -z "$SHA256" ]; then
            echo "No SoundFont configured; the installer will not include one."
            exit 0
          fi
          curl -fsSL -o "soundfonts/$(basename "$URL")" "$URL"
          echo "$SHA256  soundfonts/$(basename "$URL")" | sha256sum -c -
          if [ -n "$LICENSE_URL" ]; then curl -fsSL -o soundfonts/LICENSE-soundfont.txt "$LICENSE_URL"; fi

      - name: Stage
        run: tools/windows/stage.sh build stage soundfonts

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $path)) { choco install innosetup -y --no-progress }
            $path = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } else { $path = $iscc.Source }
          New-Item -ItemType Directory -Force installer | Out-Null
          & $path "/DStageDir=$PWD\stage" "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputDir=$PWD\installer" tools\windows\synth.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      # Install it for real, with no MSYS2 on the PATH, and play a song from
      # the installed copy: this catches a missing DLL or a wrong layout.
      - name: Try the installed program
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "synth-installed"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          if (-not (Test-Path "$dir\synth.exe")) { throw "synth.exe was not installed" }
          if (-not (Test-Path "$dir\share\synth\songs\welcome.xml")) { throw "the welcome song was not installed" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$((Get-Command python).Source | Split-Path)"
          Push-Location $env:RUNNER_TEMP
          python "$env:GITHUB_WORKSPACE\tools\smoke_headless.py" "$dir\synth.exe" - 6
          python "$env:GITHUB_WORKSPACE\tools\smoke_headless.py" "$dir\synth.exe" "$dir\share\synth\songs\demo3.xml" 6
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: synth-windows-installer
          path: installer/*-setup.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "Windows installer: run it, then use the Start menu entries, or synth.exe --headless from a terminal. Audio and MIDI on Windows are new." }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem installer\*-setup.exe).FullName --clobber
